name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite talks to a local memcached (net.spy.memcached -> localhost:11211).
    # The Datastore emulator (LocalDatastoreHelper) and Valkey (Testcontainers)
    # are started by the tests themselves; the runner already has Docker + internet.
    services:
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp package
